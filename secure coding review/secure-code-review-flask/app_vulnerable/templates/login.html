{% extends 'base.html' %}

{% block title %}Login - TeamNotes{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="card">
        <h2>Sign In to TeamNotes</h2>
        <!-- # VULN-12: Missing CSRF token in state-changing POST form -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter username (e.g. admin, alice)">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" style="width: 100%;">Login</button>
        </form>
        <p style="margin-top: 1rem; text-align: center; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary);">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
